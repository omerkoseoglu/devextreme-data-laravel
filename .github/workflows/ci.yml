name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.0', testbench: '10.0' }
          - { php: '8.3', laravel: '12.0', testbench: '10.0' }
          - { php: '8.4', laravel: '12.0', testbench: '10.0' }
          - { php: '8.3', laravel: '13.0', testbench: '11.0' }
          - { php: '8.4', laravel: '13.0', testbench: '11.0' }
    steps:
      - uses: actions/checkout@v4
      # during development the core package is a sibling path repository; CI takes it from GitHub (tags once released)
      - name: Use the core package from GitHub
        run: |
          jq '.repositories = [{"type": "vcs", "url": "https://github.com/omerkoseoglu/devextreme-data"}]' composer.json > composer.tmp
          mv composer.tmp composer.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none
      - run: composer require "illuminate/database:^${{ matrix.laravel }}" "illuminate/http:^${{ matrix.laravel }}" "illuminate/support:^${{ matrix.laravel }}" "orchestra/testbench:^${{ matrix.testbench }}" --dev -W --no-interaction --no-progress
      - run: composer cs
      - run: composer test
